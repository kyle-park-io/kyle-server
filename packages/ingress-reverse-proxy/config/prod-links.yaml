links:
  # basic
  - name: default
    route: /
    url: http://site-app-server-service.default.svc.cluster.local:8080
  - name: blog
    route: /blog
    url: http://site-app-server-service.default.svc.cluster.local:8080
  - name: dex
    route: /dex
    url: http://dex-app-server-service.default.svc.cluster.local:8080
  - name: recorder
    route: /recorder
    url: http://blockchain-tools-app-server-service.default.svc.cluster.local:8080
  - name: tracker
    route: /tracker
    url: http://blockchain-tools-app-server-service.default.svc.cluster.local:8081
  - name: redis-tcp
    route: /redis-tcp
    url: http://redis-tcp-app-server-service.default.svc.cluster.local:8080
  # Blog view counts (redis/views.go), answered by the same counter server.
  - name: api-views
    route: /api-views
    url: http://redis-tcp-app-server-service.default.svc.cluster.local:8080
    # Only POST counts, and one visitor (IP + browser) counts once per post
    # per day, so an honest reader spends one write per post they open. Six
    # posts are listed today: 20 at once covers reading all of them several
    # times, and one more every 30 seconds caps an address that rotates
    # User-Agents at about 120 extra views an hour.
    writeLimit:
      burst: 20
      every: 30s
  # static
  - name: blog-static
    route: /blog-static
    url: http://site-app-server-service.default.svc.cluster.local:8080
  - name: dex-static
    route: /dex-static
    url: http://dex-app-server-service.default.svc.cluster.local:8080
  # api
  - name: api-blog
    route: /api-blog
    url: http://site-app-server-service.default.svc.cluster.local:8080
  - name: api-dex
    route: /api-dex
    url: http://dex-app-server-service.default.svc.cluster.local:8080
  - name: api-chat
    route: /api-chat
    url: http://chat-app-envoy-service.default.svc.cluster.local:8080
  - name: api-tracker
    route: /api-tracker
    url: http://blockchain-tools-app-server-service.default.svc.cluster.local:8081
  - name: api-quant
    route: /api-quant
    url: http://kyle-quant-backend-app-server-service.default.svc.cluster.local:8080
    # Anyone can add or remove watchlist symbols; this caps how fast one
    # address can: 10 changes at once, then one more per minute
    writeLimit:
      burst: 10
      every: 1m
  - name: api-quant2
    route: /api-quant2
    url: http://kyle-quant-backend-app-server-service.default.svc.cluster.local:8081
    # Balances: only the kyle-quant server holds this token
    tokenEnv: QUANT2_API_TOKEN
  - name: api-quant3
    route: /api-quant3
    url: http://kyle-quant-backend-app-server-service.default.svc.cluster.local:8082
  # websocket (branch 전략 미정)
  - name: ws
    route: /ws
    url:
